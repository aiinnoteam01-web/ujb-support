# 누구를 위한 지원: 사업명·지원대상·사용자구분 글에 아래 낱말이 있으면 그 대상으로 분류합니다.
# 한 사업이 여러 대상에 동시에 들어갈 수 있습니다. (예: 청년 + 창업)
# 순서가 화면의 단추 순서입니다.
targets:
  청년:
    words: ["청년", "대학생", "사회초년생", "취업준비생"]
    age: [19, 39]          # 대상 나이가 이 범위 안이면 청년
  시니어:
    words: ["어르신", "노인", "시니어", "고령", "신중년", "중장년", "은퇴", "경로"]
    age_min: 50            # 대상 최소 나이가 50세 이상이면 시니어
  장애인:
    words: ["장애"]
  임산부·출산:
    words: ["임산부", "임신", "출산", "산모", "산후", "신생아", "난임", "영아", "태아"]
  소상공인:
    words: ["소상공인", "자영업", "전통시장", "상인", "골목상권", "가맹점"]
  중소기업:
    words: ["중소기업", "중견기업", "기업체", "제조업체", "수출기업", "벤처기업"]
  창업:
    words: ["창업", "스타트업", "예비창업"]
  법인·단체:
    words: ["법인", "단체", "협동조합", "비영리", "사회적기업", "마을기업"]
